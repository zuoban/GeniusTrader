name: genius-trader

services:
  trader:
    image: ghcr.io/zuoban/geniustrader:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - trader-data:/app/data
    stop_signal: SIGINT
    stop_grace_period: 20s

volumes:
  trader-data:
    name: genius-trader-data
    external: true
