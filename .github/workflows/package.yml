name: Publish GitHub Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: github-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.package.outputs.image }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read package version
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          if os.environ["REF_TYPE"] == "tag" and os.environ["REF_NAME"] != "v" + version:
              raise SystemExit("Release tag must match the Cargo.toml version")
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image={image}\nversion={version}\n")
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test native image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: genius-trader:smoke
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=genius-trader-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=genius-trader-${{ matrix.arch }}
      - name: Verify container startup and persistence
        run: python3 scripts/smoke-container.py genius-trader:smoke
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.prepare.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Binance USD-M futures service with a local Chinese console and Jev decisions
            index:org.opencontainers.image.licenses=MIT
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=genius-trader-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=genius-trader-${{ matrix.arch }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest manifests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Binance USD-M futures service with a local Chinese console and Jev decisions" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --tag "$IMAGE:sha-$REVISION" \
            "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > manifest.json
          python3 - <<'PY'
          import json, os
          with open("manifest.json") as source:
              manifest = json.load(source)
          platforms = {(entry["platform"]["os"], entry["platform"]["architecture"])
                       for entry in manifest["manifests"]}
          assert {("linux", "amd64"), ("linux", "arm64")} <= platforms, platforms
          assert manifest["annotations"]["org.opencontainers.image.source"] == (
              "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          ), manifest
          print("Verified published platforms: linux/amd64, linux/arm64")
          PY
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Verify private package and repository association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          endpoint = ("users/" + os.environ["GITHUB_REPOSITORY_OWNER"]
                      + "/packages/container/" + os.environ["IMAGE"].rsplit("/", 1)[1])
          for attempt in range(10):
              package = json.loads(subprocess.check_output([
                  "gh", "api", endpoint,
                  "--jq", "{name,visibility,html_url,repository:.repository.full_name}"
              ], text=True))
              assert package["visibility"] == "private", package
              if package["repository"] == os.environ["GITHUB_REPOSITORY"]:
                  break
              time.sleep(3)
          assert package["repository"] == os.environ["GITHUB_REPOSITORY"], package
          print(json.dumps(package))
          url = package.get("html_url") or (
              "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
              + "/pkgs/container/" + package["name"]
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f'Published `{os.environ["IMAGE"]}:{os.environ["VERSION"]}` and `latest`\n\n')
              summary.write('Platforms: `linux/amd64`, `linux/arm64`; visibility: private\n\n')
              summary.write(f'[GitHub package]({url})\n')
          PY
