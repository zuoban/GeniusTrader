[package]
name = "genius-trader"
version = "0.1.6"
edition = "2024"
rust-version = "1.89"
description = "Configurable Binance USD-M futures trading service with Jev decisions"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
axum = "0.7.9"
futures-util = "0.3.32"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
httpdate = "1.0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
